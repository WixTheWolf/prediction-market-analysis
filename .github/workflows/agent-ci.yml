name: Agent CI

on:
  pull_request:
    paths:
      - "src/agent/**"
      - "tests/agent/**"
      - "pyproject.toml"
      - ".github/workflows/agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/agent/**"
      - "tests/agent/**"
      - "pyproject.toml"
      - ".github/workflows/agent-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint agent code
        run: uv run ruff check src/agent tests/agent
      - name: Run agent tests
        run: uv run pytest tests/agent -q
