name: Live Kalshi Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-kalshi-scan.yml"
      - "src/agent/**"
      - "config/forecast_signals.json"
      - "dashboard/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-kalshi-scan.yml"
      - "src/agent/**"
      - "config/forecast_signals.json"
      - "dashboard/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: live-kalshi-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set scan timestamp
        run: echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run broad live Kalshi discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output/live
          uv run python -m src.agent.cli \
            --limit 5000 \
            --top 200 \
            --min-volume 1 \
            --max-spread 0.35 \
            --json > output/live/latest-scan.json

      - name: Validate market scan
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/live/latest-scan.json")
          try:
              markets = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"Scan output was invalid: {exc}")
              markets = []
          if not isinstance(markets, list):
              print("Scan output was not a list")
              markets = []
          path.write_text(json.dumps(markets, indent=2), encoding="utf-8")
          print(f"Publishing {len(markets)} curated Kalshi markets")
          PY

      - name: Build multi-source independent evidence
        run: |
          uv run python -m src.agent.evidence_cli \
            --markets output/live/latest-scan.json \
            --manual-signals config/forecast_signals.json \
            --output output/live/combined-signals.json \
            --metadata-output output/live/evidence-metadata.json \
            --polymarket-limit 5000 \
            --targeted-polymarket-queries 80 \
            --min-liquidity 2500 \
            --min-volume 5000 \
            --min-similarity 0.58 \
            --manifold-limit 4000 \
            --manifold-min-liquidity 500 \
            --manifold-min-volume 1000 \
            --manifold-min-similarity 0.55 \
            --predictit-limit 2000 \
            --predictit-min-similarity 0.60 \
            --metaculus-limit 1000 \
            --metaculus-min-forecasters 20 \
            --metaculus-min-similarity 0.58 \
            --weather-base-sigma 2.25 \
            --arbitrage-output output/live/arbitrage.json

      - name: Validate evidence contract
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("output/live/evidence-metadata.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("output/live/combined-signals.json").read_text(encoding="utf-8"))
          if not isinstance(evidence.get("sources"), list):
              raise SystemExit("Evidence metadata is missing the sources list")
          if not isinstance(signals, dict):
              raise SystemExit("Combined signals must be a JSON object")
          if evidence.get("source_status") == "degraded":
              raise SystemExit(f"All evidence sources degraded: {evidence.get('source_error', 'unknown')}")
          print(
              f"Evidence status={evidence.get('source_status')} "
              f"sources={len(evidence['sources'])} "
              f"signal_markets={len(signals)} "
              f"venue_matches={evidence.get('cross_venue_matches', 0)} "
              f"near={evidence.get('near_match_count', 0)}"
          )
          PY

      - name: Build evidence-first opportunity report
        run: |
          uv run python -m src.agent.opportunity_cli \
            --markets output/live/latest-scan.json \
            --signals output/live/combined-signals.json \
            --output output/live/opportunities.json \
            --bankroll 1000 \
            --top 200

      - name: Verify actionable plays against live order books
        run: |
          uv run python -m src.agent.execution_cli \
            --opportunities output/live/opportunities.json \
            --max-checks 10 \
            --slippage 0.02 \
            || echo "Order-book verification skipped; plays remain unverified."

      - name: Validate portfolio safeguards
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          markets = json.loads(Path("output/live/latest-scan.json").read_text(encoding="utf-8"))
          opportunities = json.loads(Path("output/live/opportunities.json").read_text(encoding="utf-8"))
          market_by_ticker = {item["ticker"]: item for item in markets}
          actionable = [item for item in opportunities if item.get("action") != "PASS"]
          total_risk = sum(float(item.get("maximum_loss_usd", 0.0)) for item in actionable)
          categories = [str(market_by_ticker[item["ticker"]].get("category") or item["ticker"]) for item in actionable]

          if len(actionable) > 5:
              raise SystemExit(f"Actionable play cap violated: {len(actionable)}")
          if total_risk > 100.005:
              raise SystemExit(f"Portfolio risk cap violated: ${total_risk:.2f}")
          if len(categories) != len(set(categories)):
              raise SystemExit(f"Correlated category cap violated: {categories}")
          for item in actionable:
              market = market_by_ticker[item["ticker"]]
              if float(market.get("volume", 0.0)) < 100:
                  raise SystemExit(f"Low-volume trade escaped hard gate: {item['ticker']}")
              if float(market.get("spread", 0.0)) >= 0.10:
                  raise SystemExit(f"Wide-spread trade escaped hard gate: {item['ticker']}")
              if not str(market.get("rules_text") or "").strip():
                  raise SystemExit(f"Rule-less trade escaped hard gate: {item['ticker']}")
          print(f"Validated {len(actionable)} paper plays with ${total_risk:.2f} total maximum loss")
          PY

      - name: Recover previously published paper history
        run: |
          HISTORY_URL="https://wixthewolf.github.io/prediction-market-analysis/data/history.json?run=${GITHUB_RUN_NUMBER}"
          if ! curl --fail --silent --show-error --location --retry 2 "$HISTORY_URL" -o output/live/history.previous.json; then
            printf '{"version":1,"updated_at":"","scans":[],"paper_picks":[],"performance":{}}\n' > output/live/history.previous.json
          fi
          BASE="https://wixthewolf.github.io/prediction-market-analysis/data"
          for name in opportunities arbitrage; do
            if ! curl --fail --silent --show-error --location --retry 2 \
              "${BASE}/${name}.json?run=${GITHUB_RUN_NUMBER}" -o "output/live/${name}.previous.json"; then
              printf '[]\n' > "output/live/${name}.previous.json"
            fi
          done

      - name: Update paper ledger and performance history
        run: |
          uv run python -m src.agent.paper_history_cli \
            --previous output/live/history.previous.json \
            --markets output/live/latest-scan.json \
            --opportunities output/live/opportunities.json \
            --output output/live/history.json \
            --generated-at "$GENERATED_AT" \
            --build-run "$GITHUB_RUN_NUMBER"

      - name: Grade awaiting picks against official Kalshi settlements
        run: |
          uv run python -m src.agent.settlement_cli \
            --history output/live/history.json \
            --max-lookups 25 \
            --resolved-at "$GENERATED_AT" \
            || echo "Settlement grading skipped; picks stay awaiting resolution."

      - name: Build alert body for new signals
        run: |
          uv run python -m src.agent.alerts_cli \
            --opportunities output/live/opportunities.json \
            --previous-opportunities output/live/opportunities.previous.json \
            --arbitrage output/live/arbitrage.json \
            --previous-arbitrage output/live/arbitrage.previous.json \
            --output output/live/alerts.md \
            --dashboard-url "https://wixthewolf.github.io/prediction-market-analysis/" \
            --generated-at "$GENERATED_AT" \
            || printf '' > output/live/alerts.md

      - name: Post new signals to the rolling alerts issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s output/live/alerts.md ]; then
            echo "No new signals this scan."
            exit 0
          fi
          set +e
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label trade-alert --state open \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$ISSUE" ]; then
            gh label create trade-alert --repo "$GITHUB_REPOSITORY" \
              --color FF6B7A --description "Automated command-center alerts" 2>/dev/null
            URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Command center trade alerts" --label trade-alert \
              --body "Automated feed of newly surfaced paper plays and arbitrage candidates. Subscribe to this issue for notifications. Paper research only; no orders are placed.")
            ISSUE="${URL##*/}"
          fi
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file output/live/alerts.md \
              || echo "Failed to post alert comment; continuing."
          else
            echo "Could not find or create the alerts issue; continuing."
          fi

      - name: Create run metadata and summary
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          markets = json.loads(Path("output/live/latest-scan.json").read_text(encoding="utf-8"))
          opportunities = json.loads(Path("output/live/opportunities.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("output/live/combined-signals.json").read_text(encoding="utf-8"))
          evidence = json.loads(Path("output/live/evidence-metadata.json").read_text(encoding="utf-8"))
          history = json.loads(Path("output/live/history.json").read_text(encoding="utf-8"))
          try:
              arbitrage = json.loads(Path("output/live/arbitrage.json").read_text(encoding="utf-8"))
          except Exception:
              arbitrage = []
          if not isinstance(arbitrage, list):
              arbitrage = []
          generated_at = os.environ["GENERATED_AT"]
          actionable = [item for item in opportunities if item.get("action") != "PASS"]
          watch_candidates = [
              item for item in opportunities
              if item.get("model_probability") is not None and item.get("action") == "PASS"
          ]
          categories = sorted({str(item.get("category") or "other") for item in markets})
          performance = history.get("performance", {})
          sources = evidence.get("sources", []) if isinstance(evidence.get("sources"), list) else []
          applicable_sources = [source for source in sources if source.get("status") != "not_applicable"]
          healthy_sources = [source for source in applicable_sources if source.get("status") == "healthy"]
          total_recommended_risk = sum(float(item.get("maximum_loss_usd", 0.0)) for item in actionable)
          metadata = {
              "generated_at": generated_at,
              "market_count": len(markets),
              "opportunity_count": len(actionable),
              "watch_candidate_count": len(watch_candidates),
              "research_queue_count": len(opportunities) - len(actionable),
              "evidence_signal_count": sum(len(value) for value in signals.values()),
              "evidence_market_count": len(signals),
              "cross_venue_match_count": evidence.get("cross_venue_matches", 0),
              "near_match_count": evidence.get("near_match_count", 0),
              "arbitrage_count": len(arbitrage),
              "external_market_count": evidence.get("external_markets_loaded", 0),
              "source_item_count": evidence.get("source_items_loaded", evidence.get("external_markets_loaded", 0)),
              "evidence_source_status": evidence.get("source_status", "unknown"),
              "evidence_source_count": len(applicable_sources),
              "healthy_evidence_source_count": len(healthy_sources),
              "recommended_paper_risk_usd": round(total_recommended_risk, 2),
              "category_count": len(categories),
              "paper_pick_count": performance.get("total_picks", 0),
              "open_paper_pick_count": performance.get("open_picks", 0),
              "resolved_paper_pick_count": performance.get("resolved_picks", 0),
              "marked_pnl_usd": performance.get("marked_pnl_usd", 0.0),
              "realized_pnl_usd": performance.get("realized_pnl_usd", 0.0),
              "source": "Kalshi public API + Open-Meteo Forecast API + Polymarket Gamma API + Manifold Public API",
              "mode": "read-only paper research",
              "scanner_status": "healthy" if markets else "degraded",
              "build_sha": os.environ.get("BUILD_SHA", "")[:8],
              "build_run": os.environ.get("BUILD_RUN", ""),
          }
          Path("output/live/run-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")

          lines = [
              "## Live prediction-market scan",
              "",
              f"- Generated: `{generated_at}`",
              f"- Build: `{metadata['build_sha']}` / run **{metadata['build_run']}**",
              f"- Curated Kalshi markets: **{len(markets)}**",
              f"- Independent signal markets: **{metadata['evidence_market_count']}**",
              f"- Source items loaded: **{metadata['source_item_count']}**",
              f"- Evidence sources healthy: **{len(healthy_sources)}/{len(applicable_sources)}**",
              f"- Venue-equivalent matches: **{metadata['cross_venue_match_count']}**",
              f"- Diagnostic near matches: **{metadata['near_match_count']}**",
              f"- Arbitrage candidates: **{len(arbitrage)}**",
              f"- Actionable paper plays: **{len(actionable)}**",
              f"- Recommended paper risk: **${metadata['recommended_paper_risk_usd']:,.2f}**",
              f"- Watch candidates: **{len(watch_candidates)}**",
              f"- Open paper picks: **{metadata['open_paper_pick_count']}**",
              f"- Indicative paper P/L: **${float(metadata['marked_pnl_usd']):,.2f}**",
              "- Mode: **read-only / no order execution**",
              "",
              "### Evidence sources",
              "",
              "| Source | Status | Items | Signals | Venue matches | Near matches |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for source in sources:
              lines.append(
                  f"| {source.get('name', 'Unknown')} | {source.get('status', 'unknown')} | "
                  f"{int(source.get('markets_loaded', 0))} | "
                  f"{int(source.get('signals', source.get('matches', 0)))} | "
                  f"{int(source.get('matches', 0))} | {int(source.get('near_matches', 0))} |"
              )

          if arbitrage:
              lines.extend(["", "### Arbitrage candidates", ""])
              for item in arbitrage[:5]:
                  lines.append(
                      f"- {item.get('description', '')} -> net "
                      f"{float(item.get('net_profit_after_buffer', 0.0)):.1%} after fee buffer"
                  )
              lines.append("")
              lines.append("> Cross-venue boxes are only real if both venues' resolution rules are identical. Verify before acting.")

          ranked = actionable if actionable else watch_candidates
          if ranked:
              lines.extend([
                  "",
                  "### Highest-ranked current candidates",
                  "",
                  "| Status | Side | Ticker | Price | Model | Edge | Confidence | Est. EV |",
                  "|---|---|---|---:|---:|---:|---:|---:|",
              ])
              for item in ranked[:10]:
                  status = "TRADE" if item.get("action") != "PASS" else "WATCH"
                  lines.append(
                      f"| {status} | {str(item.get('side', '')).upper()} | `{item.get('ticker', '')}` | "
                      f"{float(item.get('market_probability', 0.0)):.1%} | "
                      f"{float(item.get('model_probability', 0.0)):.1%} | "
                      f"{float(item.get('edge', 0.0)):.1%} | "
                      f"{float(item.get('confidence', 0.0)):.1%} | "
                      f"${float(item.get('expected_value_usd', 0.0)):,.2f} |"
                  )
          if not markets:
              lines.extend(["", "> The Kalshi scanner produced no curated markets."])
          elif evidence.get("source_status") == "degraded":
              lines.extend(["", f"> All evidence sources degraded: `{evidence.get('source_error', 'unknown error')}`"])
          elif not actionable:
              lines.extend(["", "> No trade cleared every gate. Ranked WATCH candidates and exact blockers remain published."])
          summary = "\n".join(lines) + "\n"
          Path("output/live/summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-scan-${{ github.run_number }}
          path: output/live/
          retention-days: 7
          if-no-files-found: error

      - name: Build static dashboard package
        run: |
          mkdir -p site/data
          touch site/.nojekyll
          cp dashboard/index.html site/index.html
          cp dashboard/runtime-overrides.js site/runtime-overrides.js
          sed -i 's#</body>#<script src="runtime-overrides.js"></script>\n</body>#' site/index.html
          cp output/live/latest-scan.json site/data/latest-scan.json
          cp output/live/opportunities.json site/data/opportunities.json
          cp output/live/run-metadata.json site/data/run-metadata.json
          cp output/live/evidence-metadata.json site/data/evidence-metadata.json
          cp output/live/history.json site/data/history.json
          cp output/live/arbitrage.json site/data/arbitrage.json

      - name: Upload dashboard package for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site-${{ github.run_number }}
          path: site/
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dashboard package
        uses: actions/download-artifact@v4
        with:
          name: dashboard-site-${{ github.run_number }}
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
