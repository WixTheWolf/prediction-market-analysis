name: Live Kalshi Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-kalshi-scan.yml"
      - "src/agent/**"
      - "config/forecast_signals.json"
      - "dashboard/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-kalshi-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run live public-market scan
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output/live
          uv run python -m src.agent.cli \
            --limit 1000 \
            --top 100 \
            --min-volume 100 \
            --max-spread 0.15 \
            --json > output/live/latest-scan.json

      - name: Require visible market data
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          markets = json.loads(Path("output/live/latest-scan.json").read_text(encoding="utf-8"))
          if not markets:
              raise SystemExit(
                  "Kalshi returned no displayable markets. Check API schema, endpoint availability, and filters."
              )
          print(f"Validated {len(markets)} displayable markets")
          PY

      - name: Build evidence-first opportunity report
        run: |
          uv run python -m src.agent.opportunity_cli \
            --markets output/live/latest-scan.json \
            --signals config/forecast_signals.json \
            --output output/live/opportunities.json \
            --bankroll 1000 \
            --top 100

      - name: Create run metadata and summary
        run: |
          uv run python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          markets = json.loads(Path("output/live/latest-scan.json").read_text(encoding="utf-8"))
          opportunities = json.loads(Path("output/live/opportunities.json").read_text(encoding="utf-8"))
          generated_at = datetime.now(timezone.utc).isoformat()
          actionable = [item for item in opportunities if item.get("action") != "PASS"]
          metadata = {
              "generated_at": generated_at,
              "market_count": len(markets),
              "opportunity_count": len(actionable),
              "source": "Kalshi public API",
              "mode": "read-only paper research",
              "scanner_status": "healthy",
          }
          Path("output/live/run-metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )

          lines = [
              "## Live Kalshi scan",
              "",
              f"- Generated: `{generated_at}`",
              f"- Displayable markets: **{len(markets)}**",
              f"- Evidence-backed paper opportunities: **{len(actionable)}**",
              "- Mode: **read-only / no order execution**",
              "",
          ]
          if opportunities:
              lines.extend([
                  "| Action | Ticker | Market | Model | Edge | Confidence | Max loss |",
                  "|---|---|---:|---:|---:|---:|---:|",
              ])
              for item in opportunities[:10]:
                  model = item.get("model_probability")
                  model_text = "—" if model is None else f"{float(model):.1%}"
                  lines.append(
                      f"| {item.get('action', 'PASS')} | `{item.get('ticker', '')}` | "
                      f"{float(item.get('market_probability', 0.0)):.1%} | {model_text} | "
                      f"{float(item.get('edge', 0.0)):.1%} | {float(item.get('confidence', 0.0)):.1%} | "
                      f"${float(item.get('maximum_loss_usd', 0.0)):,.2f} |"
                  )

          if not actionable:
              lines.extend([
                  "",
                  "> Markets are connected and visible. No trade recommendations were issued because no independent forecast signals are registered.",
              ])

          summary = "\n".join(lines) + "\n"
          Path("output/live/summary.md").write_text(summary, encoding="utf-8")
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-scan-${{ github.run_number }}
          path: output/live/
          retention-days: 7
          if-no-files-found: error

      - name: Build static dashboard package
        run: |
          mkdir -p site/data
          cp dashboard/index.html site/index.html
          cp output/live/latest-scan.json site/data/latest-scan.json
          cp output/live/opportunities.json site/data/opportunities.json
          cp output/live/run-metadata.json site/data/run-metadata.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
