name: Live Kalshi Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-kalshi-scan.yml"
      - "src/agent/**"
      - "config/forecast_signals.json"
      - "dashboard/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-kalshi-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set scan timestamp
        run: echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run broad live Kalshi discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output/live
          uv run python -m src.agent.cli \
            --limit 5000 \
            --top 200 \
            --min-volume 1 \
            --max-spread 0.35 \
            --json > output/live/latest-scan.json

      - name: Validate market scan
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/live/latest-scan.json")
          try:
              markets = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"Scan output was invalid: {exc}")
              markets = []
          if not isinstance(markets, list):
              print("Scan output was not a list")
              markets = []
          path.write_text(json.dumps(markets, indent=2), encoding="utf-8")
          print(f"Publishing {len(markets)} curated Kalshi markets")
          PY

      - name: Build multi-source independent evidence
        run: |
          uv run python -m src.agent.evidence_cli \
            --markets output/live/latest-scan.json \
            --manual-signals config/forecast_signals.json \
            --output output/live/combined-signals.json \
            --metadata-output output/live/evidence-metadata.json \
            --polymarket-limit 5000 \
            --targeted-polymarket-queries 80 \
            --min-liquidity 2500 \
            --min-volume 5000 \
            --min-similarity 0.58 \
            --manifold-limit 4000 \
            --manifold-min-liquidity 500 \
            --manifold-min-volume 1000 \
            --manifold-min-similarity 0.55

      - name: Validate evidence contract
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("output/live/evidence-metadata.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("output/live/combined-signals.json").read_text(encoding="utf-8"))
          if not isinstance(evidence.get("sources"), list):
              raise SystemExit("Evidence metadata is missing the sources list")
          if not isinstance(signals, dict):
              raise SystemExit("Combined signals must be a JSON object")
          print(
              f"Evidence status={evidence.get('source_status')} "
              f"sources={len(evidence['sources'])} "
              f"matches={evidence.get('cross_venue_matches', 0)} "
              f"near={evidence.get('near_match_count', 0)}"
          )
          PY

      - name: Build evidence-first opportunity report
        run: |
          uv run python -m src.agent.opportunity_cli \
            --markets output/live/latest-scan.json \
            --signals output/live/combined-signals.json \
            --output output/live/opportunities.json \
            --bankroll 1000 \
            --top 200

      - name: Recover previously published paper history
        run: |
          HISTORY_URL="https://wixthewolf.github.io/prediction-market-analysis/data/history.json?run=${GITHUB_RUN_NUMBER}"
          if ! curl --fail --silent --show-error --location --retry 2 "$HISTORY_URL" -o output/live/history.previous.json; then
            printf '{"version":1,"updated_at":"","scans":[],"paper_picks":[],"performance":{}}\n' > output/live/history.previous.json
          fi

      - name: Update paper ledger and performance history
        run: |
          uv run python -m src.agent.paper_history_cli \
            --previous output/live/history.previous.json \
            --markets output/live/latest-scan.json \
            --opportunities output/live/opportunities.json \
            --output output/live/history.json \
            --generated-at "$GENERATED_AT" \
            --build-run "$GITHUB_RUN_NUMBER"

      - name: Create run metadata and summary
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          markets = json.loads(Path("output/live/latest-scan.json").read_text(encoding="utf-8"))
          opportunities = json.loads(Path("output/live/opportunities.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("output/live/combined-signals.json").read_text(encoding="utf-8"))
          evidence = json.loads(Path("output/live/evidence-metadata.json").read_text(encoding="utf-8"))
          history = json.loads(Path("output/live/history.json").read_text(encoding="utf-8"))
          generated_at = os.environ["GENERATED_AT"]
          actionable = [item for item in opportunities if item.get("action") != "PASS"]
          watch_candidates = [
              item for item in opportunities
              if item.get("model_probability") is not None and item.get("action") == "PASS"
          ]
          categories = sorted({str(item.get("category") or "other") for item in markets})
          performance = history.get("performance", {})
          sources = evidence.get("sources", []) if isinstance(evidence.get("sources"), list) else []
          healthy_sources = [source for source in sources if source.get("status") == "healthy"]
          metadata = {
              "generated_at": generated_at,
              "market_count": len(markets),
              "opportunity_count": len(actionable),
              "watch_candidate_count": len(watch_candidates),
              "research_queue_count": len(opportunities) - len(actionable),
              "evidence_signal_count": sum(len(value) for value in signals.values()),
              "evidence_market_count": len(signals),
              "cross_venue_match_count": evidence.get("cross_venue_matches", 0),
              "near_match_count": evidence.get("near_match_count", 0),
              "external_market_count": evidence.get("external_markets_loaded", 0),
              "evidence_source_status": evidence.get("source_status", "unknown"),
              "evidence_source_count": len(sources),
              "healthy_evidence_source_count": len(healthy_sources),
              "category_count": len(categories),
              "paper_pick_count": performance.get("total_picks", 0),
              "open_paper_pick_count": performance.get("open_picks", 0),
              "resolved_paper_pick_count": performance.get("resolved_picks", 0),
              "marked_pnl_usd": performance.get("marked_pnl_usd", 0.0),
              "realized_pnl_usd": performance.get("realized_pnl_usd", 0.0),
              "source": "Kalshi public API + Polymarket Gamma API + Manifold Public API",
              "mode": "read-only paper research",
              "scanner_status": "healthy" if markets else "degraded",
              "build_sha": os.environ.get("BUILD_SHA", "")[:8],
              "build_run": os.environ.get("BUILD_RUN", ""),
          }
          Path("output/live/run-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")

          lines = [
              "## Live prediction-market scan",
              "",
              f"- Generated: `{generated_at}`",
              f"- Build: `{metadata['build_sha']}` / run **{metadata['build_run']}**",
              f"- Curated Kalshi markets: **{len(markets)}**",
              f"- External markets loaded: **{metadata['external_market_count']}**",
              f"- Evidence sources healthy: **{len(healthy_sources)}/{len(sources)}**",
              f"- Accepted equivalent contracts: **{metadata['cross_venue_match_count']}**",
              f"- Diagnostic near matches: **{metadata['near_match_count']}**",
              f"- Actionable paper plays: **{len(actionable)}**",
              f"- Watch candidates: **{len(watch_candidates)}**",
              f"- Open paper picks: **{metadata['open_paper_pick_count']}**",
              f"- Indicative paper P/L: **${float(metadata['marked_pnl_usd']):,.2f}**",
              "- Mode: **read-only / no order execution**",
              "",
              "### Evidence sources",
              "",
              "| Source | Status | Markets | Matches | Near matches |",
              "|---|---|---:|---:|---:|",
          ]
          for source in sources:
              lines.append(
                  f"| {source.get('name', 'Unknown')} | {source.get('status', 'unknown')} | "
                  f"{int(source.get('markets_loaded', 0))} | {int(source.get('matches', 0))} | "
                  f"{int(source.get('near_matches', 0))} |"
              )

          ranked = actionable if actionable else watch_candidates
          if ranked:
              lines.extend([
                  "",
                  "### Highest-ranked current candidates",
                  "",
                  "| Status | Side | Ticker | Price | Model | Edge | Confidence | Est. EV |",
                  "|---|---|---|---:|---:|---:|---:|---:|",
              ])
              for item in ranked[:10]:
                  status = "TRADE" if item.get("action") != "PASS" else "WATCH"
                  lines.append(
                      f"| {status} | {str(item.get('side', '')).upper()} | `{item.get('ticker', '')}` | "
                      f"{float(item.get('market_probability', 0.0)):.1%} | "
                      f"{float(item.get('model_probability', 0.0)):.1%} | "
                      f"{float(item.get('edge', 0.0)):.1%} | "
                      f"{float(item.get('confidence', 0.0)):.1%} | "
                      f"${float(item.get('expected_value_usd', 0.0)):,.2f} |"
                  )
          if not markets:
              lines.extend(["", "> The Kalshi scanner produced no curated markets."])
          elif evidence.get("source_status") == "degraded":
              lines.extend(["", f"> All evidence sources degraded: `{evidence.get('source_error', 'unknown error')}`"])
          elif not actionable:
              lines.extend(["", "> No trade cleared every gate. Ranked WATCH candidates and exact blockers remain published."])
          summary = "\n".join(lines) + "\n"
          Path("output/live/summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-scan-${{ github.run_number }}
          path: output/live/
          retention-days: 7
          if-no-files-found: error

      - name: Build static dashboard package
        run: |
          mkdir -p site/data
          touch site/.nojekyll
          cp dashboard/index.html site/index.html
          cp output/live/latest-scan.json site/data/latest-scan.json
          cp output/live/opportunities.json site/data/opportunities.json
          cp output/live/run-metadata.json site/data/run-metadata.json
          cp output/live/evidence-metadata.json site/data/evidence-metadata.json
          cp output/live/history.json site/data/history.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
